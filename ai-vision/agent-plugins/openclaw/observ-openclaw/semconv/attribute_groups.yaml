  # --------------------------------------------------------------------------
  # 业务自定义字段（L3）模板
  # --------------------------------------------------------------------------
  - id: attr.custom.common
    type: attribute_group
    brief: "业务自定义属性模板（L3 字段），业务方在命名空间隔离下使用"
    note: |
      命名规范：custom.<namespace>.<field_name>
      例如：custom.arec.module_name, custom.xxx.biz_line
      
      管理规范：
      1. 命名空间注册：业务方需向平台注册命名空间，避免冲突
      2. 类型限制：字段值类型限制为 string, number, boolean, json_string
      3. 敏感字段声明：敏感字段需在注册时声明，平台自动脱敏
      4. 审核机制：新增命名空间需经过平台审核
    attributes:
      - id: custom.namespace.field_name
        type: string
        stability: development
        brief: "业务自定义字段示例，实际使用时替换 namespace 和 field_name"
        requirement_level: opt_in
        examples: ["custom.arec.module_name=intent_recognition"]
