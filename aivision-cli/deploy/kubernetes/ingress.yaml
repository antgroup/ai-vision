apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aivision
  namespace: {{.Namespace | quote}}
{{if or (eq .INGRESS_CONTROLLER "managed") .TraefikTLS}}
  annotations:
{{if eq .INGRESS_CONTROLLER "managed"}}
    traefik.ingress.kubernetes.io/router.entrypoints: {{if eq .PUBLIC_SCHEME "https"}}websecure{{else}}web{{end}}
{{end}}
{{if .TraefikTLS}}
    traefik.ingress.kubernetes.io/router.tls: "true"
{{end}}
{{end}}
spec:
  ingressClassName: {{.INGRESS_CLASS | quote}}
{{if eq .PUBLIC_SCHEME "https"}}
  tls:
    - hosts: [{{.IngressHost | quote}}]
      secretName: {{.INGRESS_TLS_SECRET | quote}}
{{end}}
  rules:
    - {{if .IngressHost}}host: {{.IngressHost | quote}}
      {{end}}http:
        paths:
          - path: /v1/traces
            pathType: Exact
            backend:
              service: {name: antcollector-gw, port: {number: 4318}}
          - path: /v1/logs
            pathType: Exact
            backend:
              service: {name: antcollector-gw, port: {number: 4318}}
          - path: /v1/metrics
            pathType: Exact
            backend:
              service: {name: antcollector-gw, port: {number: 4318}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: aivision-fe, port: {number: 5174}}
