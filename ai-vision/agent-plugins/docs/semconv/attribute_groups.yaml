  # ============================================================
  # Agentic Runtime & Business Attributes
  # ============================================================
  - id: registry.agentic
    type: attribute_group
    display_name: Agentic Runtime
    brief: "Agentic runtime, business context, and traffic attributes."
    attributes:
      - id: agentic.collection.mode
        type: string
        stability: experimental
        requirement_level: required
        brief: "Data collection mode controlling privacy filtering."
        note: "Duplicated from resource onto every span. Use 'full' when privacy mode is not implemented."
        examples: ["full", "privacy"]

      - id: agentic.runtime.name
        type: string
        stability: experimental
        brief: "Agent runtime name."
        examples: ["claude-code", "codex", "dsh", "minimax-code"]

      - id: agentic.runtime.version
        type: string
        stability: experimental
        brief: "Agent runtime version."
        examples: ["v1.0.0"]

      - id: agentic.runtime.cwd
        type: string
        stability: experimental
        requirement_level: recommended
        brief: "Current working directory of the agent runtime."
        note: "The directory path where the agent is operating. May change between turns (e.g., worktree switches)."
        examples: ["/Users/alice/projects/myapp", "/home/bob/workspace"]

      - id: agentic.span.truncated
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Whether span attributes were reduced to satisfy the serialized span budget."
        examples: ["true"]

      - id: agentic.span.original_length
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Serialized bare-span JSON length before budget enforcement, in bytes."
        examples: [4198400]

      - id: agentic.span.size_limit
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Maximum serialized bare-span JSON length, in bytes."
        examples: [4194304]

      - id: agentic.span.truncation.reason
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Reason span attributes were reduced before export."
        examples: ["size_budget"]

      - id: agentic.mode
        type: string
        stability: experimental
        requirement_level: recommended
        brief: "Agent runtime interaction mode."
        examples: ["ask", "code"]

      - id: agentic.client.type
        type: string
        stability: experimental
        requirement_level: recommended
        brief: "Client surface that initiated the agent session."
        examples: ["CLI"]

      - id: agentic.client.version
        type: string
        stability: experimental
        requirement_level: recommended
        brief: "Client surface version that initiated the agent session."
        examples: ["2.0.1"]

      - id: agentic.turn.id
        type: string
        stability: experimental
        brief: "Turn identifier within a conversation."
        examples: ["turn-1"]

      - id: agentic.turn.number
        type: int
        stability: experimental
        brief: "Turn sequence number within a conversation (1-based)."
        examples: [1, 2, 3]

      - id: agentic.turn.index
        type: int
        stability: experimental
        brief: "Turn index within a conversation (0-based)."
        examples: [0, 1, 2]

      - id: agentic.step.number
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Host-supplied step number within a turn (1-based)."
        note: >
          DeepSeek Harness model calls, tools, and subagent invocations can share
          the number of their originating DSH step. Preserve the host number
          when present; display order is insufficient evidence for this field.
        examples: [1, 2, 3]

      - id: agentic.turn.synthetic
        type: boolean
        stability: experimental
        requirement_level:
          conditionally_required: "When the turn is synthetically created (e.g., for between-turn compaction)"
        brief: "Indicates this turn span was synthetically created for a system operation, not a user interaction."
        examples: [true]

      - id: agentic.turn.trigger
        type:
          allow_custom_values: false
          members:
            - id: interactive
              value: "interactive"
              brief: "Direct human prompt"
              stability: experimental
            - id: programmatic
              value: "programmatic"
              brief: "SDK/API initiated prompt without proof of scheduling"
              stability: experimental
            - id: queued
              value: "queued"
              brief: "Prompt delivered through the host queue"
              stability: experimental
            - id: system
              value: "system"
              brief: "Host, system, or task notification initiated turn"
              stability: experimental
            - id: subagent
              value: "subagent"
              brief: "Peer or coordinator initiated agent turn"
              stability: experimental
            - id: unknown
              value: "unknown"
              brief: "Missing, conflicting, or unsupported trigger evidence"
              stability: experimental
        stability: experimental
        requirement_level:
          conditionally_required: "For ClaudeCode and Codex Turn root spans"
        brief: "Host-observed trigger mechanism, normalized for a single agent turn."
        note: "Turn-scoped observation; only on the logical Turn root, independent from Resource ant.meta.trigger and must not be inferred from prompt text."
        examples: ["interactive", "programmatic", "queued", "system", "subagent", "unknown"]

      - id: agentic.response.index
        type: int
        stability: experimental
        brief: "LLM response index within a single turn (0-based). A turn may contain multiple LLM responses."
        examples: [0, 1]

      - id: agentic.input.delta
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Incremental input context since the previous LLM generation within the same turn."
        note: |
          For the first generation in a turn (agentic.response.index=0), this equals the user message
          (same as gen_ai.input.messages). For subsequent generations, it contains only the immediately
          preceding assistant response and its tool results — the new context added since the last LLM call.
          Serialized as a JSON array of OpenAI-format messages.
        examples: ['[{"role":"assistant","content":"...","tool_calls":[...]},{"role":"tool","tool_call_id":"...","content":"..."}]']

      - id: agentic.tool.count
        type: int
        stability: experimental
        brief: "Number of tool calls triggered in this LLM response."
        examples: [0, 1, 3]

      - id: agentic.tool.type
        type:
          allow_custom_values: true
          members:
            - id: builtin
              value: "builtin"
              brief: "Built-in tool (e.g. Read, Write, Bash, Grep)"
              stability: experimental
            - id: mcp
              value: "mcp"
              brief: "MCP server tool call"
              stability: experimental
            - id: skill
              value: "skill"
              brief: "Skill/command invocation"
              stability: experimental
            - id: system
              value: "system"
              brief: "Agent runtime system operation such as context compaction"
              stability: experimental
        stability: experimental
        requirement_level: opt_in
        brief: "Tool classification inferred from the raw tool name or runtime-specific invocation evidence."
        examples: ["builtin", "mcp", "skill", "system"]
        note: |
          Inference rules:
          - `gen_ai.tool.name` starts with `mcp__`  → `mcp`
          - `gen_ai.tool.name` equals `Skill`        → `skill`
          - A successful generic `read` that matches the active session's
            `<available_skills>` location (or strict unknown-catalog fallback)
            remains `builtin`; a separate zero-duration derived span emitted
            after that read uses `gen_ai.tool.name=Skill` and type `skill`
          - Otherwise                                → `builtin`

      - id: agentic.tool.name
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Parsed logical name of the tool, derived from the raw name or runtime-specific invocation evidence."
        examples: ["Read", "code_search.query_code_with_keyword", "eve-beta-skill", "medeval:task-one-shot"]
        note: |
          Derivation from `gen_ai.tool.name`:
          - builtin: same as `gen_ai.tool.name` (e.g. `Read`, `Write`, `Bash`)
          - mcp: strip `mcp__` prefix, replace `__` with `.`
            (e.g. `mcp__code_search__query_code_with_keyword` → `code_search.query_code_with_keyword`)
          - skill: the skill name from isMeta message or keyword matching
            (e.g. `eve-beta-skill`, `medeval:task-one-shot`)
          - derived Skill load: the catalog name for the exact `SKILL.md`
            location; strict fallback uses the terminal skill directory name

      - id: agentic.tool.derived
        type: boolean
        stability: experimental
        requirement_level: opt_in
        brief: "Whether this span is a derived semantic observation rather than a physical tool invocation."
        examples: [true]
        note: |
          Set to true only for derived Skill-load observations. Consumers that
          count physical tool executions must exclude these spans and use the
          physical tool event/metrics as the source of truth.

      - id: agentic.tool.call_id.synthetic
        type: boolean
        stability: experimental
        requirement_level: opt_in
        brief: "Whether gen_ai.tool.call.id was synthesized rather than supplied by the runtime."
        examples: [true]
        note: |
          Derived Skill-load observations always use a distinct synthetic call
          id. Physical ID-less tool calls may also set this marker when local
          correlation creates their call id.

      - id: agentic.error.category
        type:
          allow_custom_values: false
          members:
            - id: api_error
              value: "api_error"
              brief: "Provider/API returned an application or protocol error."
              stability: experimental
            - id: network_error
              value: "network_error"
              brief: "Network transport failed before a valid application response."
              stability: experimental
            - id: timeout
              value: "timeout"
              brief: "Operation exceeded its timeout budget."
              stability: experimental
            - id: rate_limit
              value: "rate_limit"
              brief: "Provider or runtime rejected the operation due to rate limits."
              stability: experimental
            - id: auth
              value: "auth"
              brief: "Authentication failed or credentials were invalid."
              stability: experimental
            - id: permission
              value: "permission"
              brief: "Authorization, policy, or user permission denied the operation."
              stability: experimental
            - id: validation
              value: "validation"
              brief: "Input, schema, argument, or request validation failed."
              stability: experimental
            - id: tool_error
              value: "tool_error"
              brief: "Tool execution failed after being invoked."
              stability: experimental
            - id: cancelled
              value: "cancelled"
              brief: "Operation was cancelled by user, runtime, or policy."
              stability: experimental
            - id: other
              value: "other"
              brief: "Known error that cannot be mapped to a stable category."
              stability: experimental
        stability: experimental
        requirement_level:
          conditionally_required: "Required on API request and tool error count metric datapoints."
        brief: "Low-cardinality error category for RED error metrics."
        examples: ["timeout", "rate_limit", "tool_error", "other"]
        note: |
          This attribute is intentionally low-cardinality and bounded for metric
          dimensions. Raw error classes and messages belong in correlated events
          (`error.type`, `error.message`) rather than metric datapoint attributes.

      - id: agentic.tool.raw_name
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Original tool name as reported by the agent runtime, before parsing."
        examples: ["mcp__code_search__query_code_with_keyword", "Skill", "Bash", "mcp__openaiDeveloperDocs__search_openai_docs"]
        note: |
          Preserves the raw tool identifier from the agent runtime (e.g. Claude Code, Codex).
          Useful for debugging and correlating with agent-internal tool registries.
          - builtin: same as the tool name (e.g. `Bash`, `Read`)
          - mcp: the full `mcp__<server>__<method>` encoding
          - native skill: `Skill` (the literal tool name used by the runtime)
          - derived Skill load: the source generic tool name, e.g. `read`

      - id: agentic.tool.duration_ms
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "Tool execution duration in milliseconds, from tool.execute.before to tool.execute.after; derived instantaneous observations use 0."
        examples: [0, 85, 450, 2717]

      - id: agentic.llm.auxiliary
        type: boolean
        stability: experimental
        requirement_level: opt_in
        brief: "Runtime-observed background LLM request with no user Turn ordinal."
        note: >
          Set true only for OpenCode's native title, summary, or compaction
          request observed at the official provider hooks without an assistant
          message correlation. Preserve the source conversation and agent name,
          and derive gen_ai.chat.id as aux:<agent>:<official message id>.
          Such requests remain standalone LLM spans; never manufacture a CHAT
          span, a zero Turn number, or a parent from the current user Turn.
          Uncorrelated primary calls and unknown agent names cannot use this marker.
        examples: [true]

      - id: agentic.llm.duration_ms
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "LLM request duration in milliseconds, from llm_input to llm_output."
        examples: [1200, 5000, 15000]

      - id: agentic.llm.generation.duration_ms
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Elapsed milliseconds from the first output token to generation completion."
        note: >
          Emit only when both timestamps describe the same observed generation.
          Omit the field when either boundary is missing or the generation
          timing cannot be distinguished from retries or interruption.
        examples: [850, 2100]

      - id: agentic.llm.ttfb_ms
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Time to first byte in milliseconds for the LLM response."
        examples: [200, 800, 1500]

      - id: agentic.model_call.id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Provider-assigned or framework-assigned call identifier for a single model API invocation."
        examples: ["call-abc123", "req-456"]

      - id: agentic.llm.error.type
        type: string
        stability: experimental
        requirement_level: recommended
        brief: "LLM error category for API/client failures."
        examples: ["api_error", "ProviderAuthError"]

      - id: agentic.llm.error.message
        type: string
        stability: experimental
        requirement_level: recommended
        brief: "LLM error message, redacted in privacy mode when content collection is disabled."
        examples: ["[REDACTED]"]

      - id: agentic.llm.error.status_code
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "LLM/API error status code when available."
        examples: [401, 429]

      - id: agentic.llm.retry.attempt
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Retry attempt number for an LLM/API error span."
        examples: [1, 2, 3]

      - id: agentic.llm.retry.max
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Maximum retry count configured for the LLM/API request."
        examples: [3, 5]

      - id: agentic.llm.retry.delay_ms
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Retry delay in milliseconds before the next LLM/API attempt."
        examples: [500, 1200]

      - id: agentic.llm.retry_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Total number of LLM/API retries associated with a generation span."
        examples: [1, 2]

      - id: agentic.llm.is_synthetic
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Marker indicating the generation span represents a synthetic client-side API-error message."
        examples: ["true"]

      - id: agentic.llm.step
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "Zero-based index of this LLM step within the turn (matches StepBegin.n from wire.jsonl)."
        examples: [0, 1, 2]

      - id: agentic.tool.id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Tool invocation identifier."
        examples: ["toolu_abc123", "skill-eve-beta-skill"]
        note: |
          Typically equals `gen_ai.tool.call.id` for builtin and mcp tools.
          For skill invocations without a real tool_use_id, a synthetic
          id is generated as `skill-{skill_name}`.

      - id: agentic.subagent.name
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Subagent invocation name as reported by the agent runtime."
        examples: ["Agent", "Task"]

      - id: agentic.subagent.session_key
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Runtime session key for the spawned subagent transcript."
        examples: ["agent_b3f813f2-a315-4959-aada-af454725839e"]

      - id: agentic.subagent
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Boolean marker indicating this span belongs to a subagent session."
        examples: ["true"]

      - id: agentic.subagent.mode
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Subagent execution mode."
        examples: ["sync", "async"]

      - id: agentic.subagent.depth
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Nesting depth of the subagent (1 = direct child of root)."
        examples: [1, 2]

      - id: agentic.subagent.parent_thread_id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Session/thread ID of the parent that spawned this subagent."
        examples: ["019e54a5-e6c6-7432-978e-f9620b5a2e8b"]

      - id: agentic.subagent.child_thread_id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Session/thread ID of the spawned child subagent."
        examples: ["019e54a6-7b9e-7f50-8024-2bc88c07f89b"]

      - id: agentic.subagent.sender_thread_id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Thread ID of the agent that initiated the spawn/interaction."
        examples: ["thread-parent"]

      - id: agentic.subagent.receiver_thread_id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Thread ID of the agent receiving an interaction message."
        examples: ["thread-child-1"]

      - id: agentic.subagent.nickname
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Human-readable nickname of the subagent."
        examples: ["Dewey", "worker"]

      - id: agentic.subagent.agent_nickname
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Agent nickname from session_meta source (child-up model)."
        examples: ["Dewey", "coder"]

      - id: agentic.subagent.role
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Role of the subagent."
        examples: ["worker", "coder", "analyst"]

      - id: agentic.subagent.agent_role
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Agent role from session_meta source (child-up model)."
        examples: ["worker", "coder"]

      - id: agentic.subagent.agent_path
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Hierarchical path of the subagent in the agent tree."
        examples: ["/root/worker/coder"]

      - id: agentic.subagent.call_id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Tool call ID that spawned this subagent."
        examples: ["call_btsNB7AIEaIocsjeavC4v6Li"]

      - id: agentic.subagent.status
        type: string
        stability: experimental
        requirement_level: opt_in
