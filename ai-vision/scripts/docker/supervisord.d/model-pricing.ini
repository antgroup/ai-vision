[program:model-pricing]
command=/usr/bin/timeout --kill-after=2s 60s /opt/venv/bin/python manage.py sync_model_pricing --bundled --if-missing
directory=/home/admin/aivision
user=admin
autostart=true
autorestart=false
startsecs=0
stopwaitsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/admin/logs/aivision/model-pricing.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
