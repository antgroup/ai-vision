name: Product Compose lifecycle

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Compatible candidate images JSON: signoz, gateway, backend, agentlens, frontend'
        required: true
        type: string
      upgrade_images:
        description: 'Replacement images JSON; at least one application image ID must change'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: product-compose-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Compose ${{ matrix.backend }} (${{ matrix.mode }})
    runs-on: ${{ vars.AIVISION_E2E_DOCKER_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        backend: [oceanbase, seekdb]
        mode: [managed, external]
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      CANDIDATE_IMAGES: ${{ inputs.images }}
      UPGRADE_IMAGES: ${{ inputs.upgrade_images }}
      SEEKDB_IMAGE: oceanbase/seekdb@sha256:500910bda197c0bc5f8bbada10c6ad727807308826818c0ea0391844dedc5cc2
      OCEANBASE_IMAGE: oceanbase/oceanbase-ce@sha256:eaa2c3b3513fa21e4a658f197c1deb93c9d6b6eb742cfa5ef0f085f82b9cec54
    steps:
      - name: Check Docker capacity before build work
        run: |
          python3 - <<'PYRESOURCES'
          import json, subprocess
          info = json.loads(subprocess.check_output(
              ['docker', 'info', '--format', '{{json .}}'], timeout=30))
          if info.get('MemTotal', 0) < 14 * 1024 ** 3:
              raise SystemExit(
                  'Compose qualification needs at least 14 GiB Docker memory. '
                  'Set AIVISION_E2E_DOCKER_LINUX_RUNNER to a suitably sized Linux x64 runner '
                  'before dispatching; standard private-repository runners have 8 GB.')
          PYRESOURCES
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: aivision-cli/go.mod
          cache: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Check runner and deployment materials
        run: |
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          python deploy/scripts/package_assets.py --check
          (cd aivision-cli && go run -mod=vendor ./internal/deploy/renderproduct --check)
          docker compose version
      - name: Build the Go deployment controller
        working-directory: aivision-cli
        run: go build -mod=vendor -o "$RUNNER_TEMP/aiv" .
      - name: Fresh install, recovery, persistence and real image upgrade
        env:
          TEST_BACKEND: ${{ matrix.backend }}
          TEST_MODE: ${{ matrix.mode }}
          EVIDENCE: ${{ runner.temp }}/compose-${{ matrix.backend }}-${{ matrix.mode }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          command = [sys.executable, 'deploy/tests/compose_smoke.py',
                     '--aiv', os.path.join(os.environ['RUNNER_TEMP'], 'aiv'),
                     '--backend', os.environ['TEST_BACKEND'],
                     '--runtime-base', os.environ['RUNNER_TEMP'],
                     '--out', os.environ['EVIDENCE'],
                     '--images-json', os.environ['CANDIDATE_IMAGES'],
                     '--upgrade-images-json', os.environ['UPGRADE_IMAGES']]
          if os.environ['TEST_MODE'] == 'external':
              command.append('--external')
          subprocess.run(command, check=True)
          PY
      - name: Preserve sanitized lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-${{ matrix.backend }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/compose-${{ matrix.backend }}-${{ matrix.mode }}/*.json
            ${{ runner.temp }}/compose-${{ matrix.backend }}-${{ matrix.mode }}/*.log
          if-no-files-found: error
          retention-days: 7
