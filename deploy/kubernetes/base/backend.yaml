apiVersion: apps/v1
kind: Deployment
metadata:
  name: aivision-be
  namespace: {{.Namespace | quote}}
  labels: {app.kubernetes.io/component: backend}
spec:
  replicas: 1
  minReadySeconds: 5
  progressDeadlineSeconds: 1320
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aivision-be}
  template:
    metadata:
      labels: {app.kubernetes.io/component: backend, app: aivision-be, app.kubernetes.io/part-of: aivision}
      annotations:
        aivision.ob-labs.io/config: {{.ConfigHash | quote}}
        aivision.ob-labs.io/rollout: {{.Rollout | quote}}
    spec:
      serviceAccountName: aivision
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: be
          image: {{.BE_IMAGE | quote}}
          imagePullPolicy: {{.IMAGE_PULL | quote}}
          ports: [{containerPort: 8001, name: http}]
          envFrom:
            - configMapRef: {name: aivision-backend}
            - secretRef: {name: aivision-backend}
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
              httpHeaders: [{name: Host, value: aivision-be}]
            periodSeconds: 5
            failureThreshold: 240
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
              httpHeaders: [{name: Host, value: aivision-be}]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              httpHeaders: [{name: Host, value: aivision-be}]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: {{.BE_CONTAINER_MEMORY | memoryQuantity | quote}}}
---
apiVersion: v1
kind: Service
metadata:
  name: aivision-be
  namespace: {{.Namespace | quote}}
  labels: {app.kubernetes.io/component: backend}
spec:
  selector: {app: aivision-be}
  ports: [{name: http, port: 8001, targetPort: http}]
