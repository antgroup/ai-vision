  # ============================================================
  # Agentic Usage Token Attributes (Three-Layer Model)
  # Version: v4.0
  # ============================================================
  - id: registry.agentic.usage
    type: attribute_group
    display_name: Agentic Usage (Token Breakdown)
    brief: "Three-layer token usage model: L2 breakdown and L3 raw per-provider fields."
    note: |
      Layer 2 subset invariants (MUST hold for valid data):
        fresh_input_tokens + cache_read_tokens + cache_write_tokens = gen_ai.usage.input_tokens
        reasoning_tokens <= gen_ai.usage.output_tokens
        tool_tokens <= gen_ai.usage.input_tokens + gen_ai.usage.output_tokens
      Violation of these constraints indicates a Normalizer bug.
      null means the agent/provider does not support the field; 0 means supported but zero for this request.
    attributes:
      # ── Layer 2: Breakdown (derived from Layer 1 gen_ai.usage.*) ──
      - id: agentic.usage.fresh_input_tokens
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "Input tokens excluding cache (= gen_ai.usage.input_tokens - cache_read_tokens - cache_write_tokens)."
        examples: [87, 1500]

      - id: agentic.usage.cache_read_tokens
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "Cache hit input tokens. Subset of gen_ai.usage.input_tokens."
        examples: [49024, 0]

      - id: agentic.usage.input_tokens.missing
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Whether input-token usage is unavailable from the actual source."
        note: "Only the exact string 'true' marks input usage unknown and permits omitting the input count. It does not waive output or non-usage fields. Unknown is not measured zero; legacy numeric placeholders with this marker remain unknown."
        examples: ["true"]

      - id: agentic.usage.output_tokens.missing
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Whether output-token usage is unavailable from the actual source."
        note: "Only the exact string 'true' marks output usage unknown and permits omitting the output count. It does not waive input or non-usage fields. Either unknown direction permits omitting an input+output total. Unknown is not measured zero; legacy numeric placeholders with this marker remain unknown."
        examples: ["true"]

      - id: agentic.usage.cache_read_tokens.missing
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Whether cache-read token usage is unavailable from the actual source."
        note: "Only the exact string 'true' marks the detail unavailable, including when the host erased reportedness. Omit the corresponding numeric detail; unknown is not measured zero. This marker does not waive other usage or required attributes."
        examples: ["true"]

      - id: agentic.usage.cache_write_tokens.missing
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Whether cache-write token usage is unavailable from the actual source."
        note: "Only the exact string 'true' marks the detail unavailable, including when the host erased reportedness. Omit the corresponding numeric detail; unknown is not measured zero. This marker does not waive other usage or required attributes."
        examples: ["true"]

      - id: agentic.usage.reasoning_tokens.missing
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Whether reasoning-token usage is unavailable from the actual source."
        note: "Only the exact string 'true' marks the detail unavailable, including when the host erased reportedness. Omit the corresponding numeric detail; unknown is not measured zero. This marker does not waive other usage or required attributes."
        examples: ["true"]

      - id: agentic.usage.tool_tokens.missing
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Whether tool-token usage is unavailable from the actual source."
        note: "Only the exact string 'true' marks the detail unavailable, including when the host erased reportedness. Omit the corresponding numeric detail; unknown is not measured zero. This marker does not waive other usage or required attributes."
        examples: ["true"]

      - id: agentic.usage.cache_write_tokens
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "Cache creation input tokens. Subset of gen_ai.usage.input_tokens."
        examples: [0, 5000]

      - id: agentic.usage.reasoning_tokens
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "Internal reasoning/thinking tokens. Subset of gen_ai.usage.output_tokens."
        examples: [500, 0]

      - id: agentic.usage.tool_tokens
        type: int
        stability: experimental
        requirement_level: recommended
        brief: "Tool definition + tool call result tokens. Cross-cuts input and output."
        examples: [200, 0]

      # ── Layer 3: Raw - Anthropic (provider version: Anthropic API 2024-10) ──
      - id: agentic.usage.raw.input_tokens
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Anthropic raw: new input tokens, excludes cache."
        note: "opt-in (by anthropic). Maps to Anthropic API `usage.input_tokens`."
        examples: [87]

      - id: agentic.usage.raw.cache_read_input_tokens
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Anthropic raw: cache read (hit) tokens."
        note: "opt-in (by anthropic). Maps to Anthropic API `usage.cache_read_input_tokens`."
        examples: [49024]

      - id: agentic.usage.raw.cache_creation_input_tokens
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Anthropic raw: cache creation tokens."
        note: "opt-in (by anthropic). Maps to Anthropic API `usage.cache_creation_input_tokens`."
        examples: [0]

      - id: agentic.usage.raw.output_tokens
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Anthropic raw: output tokens (includes thinking)."
        note: "opt-in (by anthropic). Maps to Anthropic API `usage.output_tokens`."
        examples: [386]

      # ── Layer 3: Raw - OpenAI (provider version: OpenAI API 2024-12) ──
      - id: agentic.usage.raw.input_token_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "OpenAI raw: total input tokens (includes cache)."
        note: "opt-in (by openai). Maps to OpenAI API `usage.prompt_tokens`."
        examples: [1500]

      - id: agentic.usage.raw.output_token_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "OpenAI raw: output tokens (includes reasoning)."
        note: "opt-in (by openai). Maps to OpenAI API `usage.completion_tokens`."
        examples: [800]

      - id: agentic.usage.raw.reasoning_token_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "OpenAI raw: reasoning tokens (subset of output)."
        note: "opt-in (by openai). Maps to OpenAI API `usage.completion_tokens_details.reasoning_tokens`."
        examples: [500]

      - id: agentic.usage.raw.tool_token_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "OpenAI raw: tool-related tokens (cross input+output)."
        note: "opt-in (by openai). Codex CLI specific field."
        examples: [200]

      # ── Layer 3: Raw - Google (provider version: Gemini API 2025-03) ──
      - id: agentic.usage.raw.prompt_token_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Google raw: prompt tokens (includes cache)."
        note: "opt-in (by google). Maps to Gemini API `usageMetadata.promptTokenCount`."
        examples: [1500]

      - id: agentic.usage.raw.candidates_token_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Google raw: candidate output tokens."
        note: "opt-in (by google). Maps to Gemini API `usageMetadata.candidatesTokenCount`."
        examples: [800]

      - id: agentic.usage.raw.cached_content_token_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Google raw: cached content tokens (subset of prompt)."
        note: "opt-in (by google). Maps to Gemini API `usageMetadata.cachedContentTokenCount`."
        examples: [1200]

      - id: agentic.usage.raw.thoughts_token_count
        type: int
        stability: experimental
        requirement_level: opt_in
        brief: "Google raw: thinking tokens (subset of candidates)."
        note: "opt-in (by google). Maps to Gemini API `usageMetadata.thoughtsTokenCount`."
        examples: [400]

  # ============================================================
  # Internal Trace Propagation Attributes
  # ============================================================
  - id: registry.internal.sofa
    type: attribute_group
    display_name: Internal SOFA Trace Propagation
    brief: >
      Internal attributes for SOFA-to-OTel trace context propagation.
      Set on both spans and span links to preserve the original SOFA
      identifiers for debugging and cross-system correlation.
      These attributes are prefixed with `_internal.` to indicate they
      are implementation-specific and not part of the public semconv contract.
    attributes:
      - id: _internal.sofa.trace_id
        type: string
        stability: experimental
        requirement_level:
          conditionally_required: "When upstream SOFA trace headers are present"
        brief: "Original SOFA TraceId from upstream HTTP request header `sofa-traceid`."
        examples: ["0a1b2c3d4e5f67890a1b2c3d4e5f6789", "1e2004b7163914d430173e60e611f900"]

      - id: _internal.sofa.span_id
        type: string
        stability: experimental
        requirement_level:
          conditionally_required: "When upstream SOFA trace headers are present"
        brief: "Original SOFA RpcId from upstream HTTP request header `sofa-rpcid`."
        examples: ["0.1.2.3", "0.1"]

      - id: _internal.sofa.request_id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Request ID from upstream HTTP request header `x-request-id`, if present."
        examples: ["req-abc-123", "7f3d2a1b"]

      - id: _internal.span_link.role
        type: string
        stability: experimental
        requirement_level:
          conditionally_required: "When a span link to an upstream trace context is present"
        brief: >
          Role of the span link, indicating the relationship between the current
          span and the linked span context. Set on both the span link attributes
          and the span itself.
        examples: ["child", "parent"]
        note: >
          `child` means the current span is a child of the linked context
          (e.g., openclaw receiving an upstream SOFA request).
          `parent` means the current span is a parent of the linked context
          (e.g., making an outbound SOFA call).

  - id: registry.internal.meta
    type: attribute_group
    display_name: Internal Trace Metadata
    brief: >
      Internal metadata used by repository-owned trace indexing and display.
      These attributes describe logical application roles and do not replace
      OpenTelemetry trace topology.
    attributes:
      - id: _internal.meta.root
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: >
          Identifies a logical agent Turn root for trace indexing. The value is
          the string `1`; it does not imply that the span has no OTel parent.
        examples: ["1"]
        note: >
          Currently emitted by Claude Code, Codex, OpenCode, OpenClaw,
          and Pi owned Turn roots. Borrowed subagent AGENT spans, synthetic
          compaction CHAT spans, LLM generations (including spans whose operation
          name is `chat`), and other non-Turn spans do not use this marker.
