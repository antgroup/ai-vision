# yaml-language-server: $schema=../semconv.schema.json
# OpenClaw 可观测语义约定 - Events 定义
# 文档版本: v1.0
# 基于 Claude Code 文档: https://code.claude.com/docs/en/monitoring-usage

groups:
  # --------------------------------------------------------------------------
  # User Prompt Event
  # --------------------------------------------------------------------------
  - id: event.openclaw.user_prompt
    type: event
    name: openclaw.user_prompt
    brief: "Logged when a user submits a prompt"
    stability: development
    attributes:
      - ref: session.id
        requirement_level: recommended
      - ref: app.version
        requirement_level: opt_in
      - ref: organization.id
        requirement_level: recommended
      - ref: user.account_uuid
        requirement_level: recommended
      - ref: user.id
        requirement_level: recommended
      - ref: user.email
        requirement_level: recommended
      - ref: terminal.type
        requirement_level: recommended
      - ref: prompt.id
        requirement_level: recommended
      - ref: event.name
        requirement_level: required
      - ref: event.timestamp
        requirement_level: required
      - ref: event.sequence
        requirement_level: recommended
      - ref: openclaw.prompt.length
        requirement_level: recommended
      - ref: openclaw.prompt.content
        requirement_level: opt_in

  # --------------------------------------------------------------------------
  # Tool Result Event
  # --------------------------------------------------------------------------
  - id: event.openclaw.tool_result
    type: event
    name: openclaw.tool_result
    brief: "Logged when a tool completes execution"
    stability: development
    attributes:
      - ref: session.id
        requirement_level: recommended
      - ref: app.version
        requirement_level: opt_in
      - ref: organization.id
        requirement_level: recommended
      - ref: user.account_uuid
        requirement_level: recommended
      - ref: user.id
        requirement_level: recommended
      - ref: user.email
        requirement_level: recommended
      - ref: terminal.type
        requirement_level: recommended
      - ref: prompt.id
        requirement_level: recommended
      - ref: event.name
        requirement_level: required
      - ref: event.timestamp
        requirement_level: required
      - ref: event.sequence
        requirement_level: recommended
      - ref: gen_ai.tool.name
        requirement_level: required
      - ref: openclaw.tool.success
        requirement_level: required
      - ref: openclaw.tool.duration_ms
        requirement_level: recommended
      - ref: openclaw.tool.error
        requirement_level:
          conditionally_required: "If success is false"
      - ref: openclaw.decision
        requirement_level: recommended
      - ref: openclaw.decision_source
        requirement_level: recommended
      - ref: openclaw.tool.result_size_bytes
        requirement_level: recommended
      - ref: openclaw.tool.mcp_server_scope
        requirement_level:
          conditionally_required: "For MCP tools"
      - ref: openclaw.tool.parameters
        requirement_level: opt_in

  # --------------------------------------------------------------------------
  # API Request Event
  # --------------------------------------------------------------------------
  - id: event.openclaw.api_request
    type: event
    name: openclaw.api_request
    brief: "Logged for each API request to the LLM"
    stability: development
    attributes:
      - ref: session.id
        requirement_level: recommended
      - ref: app.version
        requirement_level: opt_in
      - ref: organization.id
        requirement_level: recommended
      - ref: user.account_uuid
        requirement_level: recommended
      - ref: user.id
        requirement_level: recommended
      - ref: user.email
        requirement_level: recommended
      - ref: terminal.type
        requirement_level: recommended
      - ref: prompt.id
        requirement_level: recommended
      - ref: event.name
        requirement_level: required
      - ref: event.timestamp
        requirement_level: required
      - ref: event.sequence
        requirement_level: recommended
      - ref: gen_ai.request.model
        requirement_level: required
      - ref: openclaw.api.cost_usd
        requirement_level: recommended
      - ref: openclaw.api.duration_ms
        requirement_level: recommended
      - ref: gen_ai.usage.input_tokens
        requirement_level: recommended
      - ref: gen_ai.usage.output_tokens
        requirement_level: recommended
      - ref: openclaw.api.cache_read_tokens
        requirement_level: recommended
      - ref: openclaw.api.cache_creation_tokens
        requirement_level: recommended
      - ref: openclaw.speed
        requirement_level: recommended

  # --------------------------------------------------------------------------
  # API Error Event
  # --------------------------------------------------------------------------
  - id: event.openclaw.api_error
    type: event
    name: openclaw.api_error
    brief: "Logged when an API request to the LLM fails"
    stability: development
    attributes:
      - ref: session.id
        requirement_level: recommended
      - ref: app.version
        requirement_level: opt_in
      - ref: organization.id
        requirement_level: recommended
      - ref: user.account_uuid
        requirement_level: recommended
      - ref: user.id
        requirement_level: recommended
      - ref: user.email
        requirement_level: recommended
      - ref: terminal.type
        requirement_level: recommended
      - ref: prompt.id
        requirement_level: recommended
      - ref: event.name
        requirement_level: required
      - ref: event.timestamp
        requirement_level: required
      - ref: event.sequence
        requirement_level: recommended
      - ref: gen_ai.request.model
        requirement_level: required
      - ref: openclaw.api.error
        requirement_level: required
      - ref: openclaw.api.status_code
        requirement_level: recommended
      - ref: openclaw.api.duration_ms
        requirement_level: recommended
      - ref: openclaw.api.attempt
        requirement_level: recommended
      - ref: openclaw.speed
        requirement_level: recommended

  # --------------------------------------------------------------------------
  # Tool Decision Event
  # --------------------------------------------------------------------------
  - id: event.openclaw.tool_decision
    type: event
    name: openclaw.tool_decision
    brief: "Logged when a tool permission decision is made (accept/reject)"
    stability: development
    attributes:
      - ref: session.id
        requirement_level: recommended
      - ref: app.version
        requirement_level: opt_in
      - ref: organization.id
        requirement_level: recommended
      - ref: user.account_uuid
        requirement_level: recommended
      - ref: user.id
        requirement_level: recommended
      - ref: user.email
        requirement_level: recommended
      - ref: terminal.type
        requirement_level: recommended
      - ref: prompt.id
        requirement_level: recommended
      - ref: event.name
        requirement_level: required
      - ref: event.timestamp
        requirement_level: required
      - ref: event.sequence
        requirement_level: recommended
      - ref: gen_ai.tool.name
        requirement_level: required
      - ref: openclaw.decision
        requirement_level: required
      - ref: openclaw.decision_source
        requirement_level: required