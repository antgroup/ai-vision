syntax = "proto3";

package jaeger.api_v3;

import "opentelemetry/proto/trace/v1/trace.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

option go_package = "github.com/jaegertracing/jaeger-idl/proto-gen/api_v3";
option java_package = "io.jaegertracing.api_v3";

service QueryService {
  rpc GetTrace(GetTraceRequest) returns (stream TracesData);
  rpc FindTraces(FindTracesRequest) returns (stream TracesData);
  rpc GetServices(GetServicesRequest) returns (GetServicesResponse);
  rpc GetOperations(GetOperationsRequest) returns (GetOperationsResponse);
  rpc GetDependencies(GetDependenciesRequest) returns (GetDependenciesResponse);
  rpc FindTraceSummaries(FindTraceSummariesRequest) returns (FindTraceSummariesResponse);
}

message TracesData {
  opentelemetry.proto.trace.v1.TracesData traces = 1;
}

message GetTraceRequest {
  string trace_id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  bool raw_traces = 4;
}

message TraceQueryParameters {
  string service_name = 1;
  string operation_name = 2;
  map<string, string> attributes = 3;
  google.protobuf.Timestamp start_time_min = 4;
  google.protobuf.Timestamp start_time_max = 5;
  google.protobuf.Duration duration_min = 6;
  google.protobuf.Duration duration_max = 7;
  int32 search_depth = 8;
  bool raw_traces = 9;
}

message FindTracesRequest {
  TraceQueryParameters query = 1;
}

message GetServicesRequest {}

message GetServicesResponse {
  repeated string services = 1;
}

message GetOperationsRequest {
  string service = 1;
  string span_kind = 2;
}

message GetOperationsResponse {
  repeated Operation operations = 1;
}

message Operation {
  string name = 1;
  string span_kind = 2;
}

message GetDependenciesRequest {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
}

message GetDependenciesResponse {
  repeated DependencyLink dependencies = 1;
}

message DependencyLink {
  string parent = 1;
  string child = 2;
  uint64 call_count = 3;
}

message FindTraceSummariesRequest {
  TraceQueryParameters query = 1;
}

message FindTraceSummariesResponse {
  repeated TraceSummary trace_summaries = 1;
}

message TraceSummary {
  string trace_id = 1;
  string root_service_name = 2;
  string root_operation_name = 3;
  google.protobuf.Timestamp start_time = 4;
  uint64 duration_ms = 5;
  uint32 span_count = 6;
  uint32 error_span_count = 7;
  repeated ServiceSummary services = 8;
}

message ServiceSummary {
  string name = 1;
  uint32 span_count = 2;
  uint32 error_span_count = 3;
}
