name: MiniMax Code candidate

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/minimax-code-candidate.yml'
      - 'ai-vision/agent-plugins/minimax-code/**'
      - 'ai-vision/agent-plugins/tests/native_agent_e2e/minimax_candidate.py'

permissions:
  contents: read

concurrency:
  group: minimax-code-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PLUGINS_DIR: ai-vision/agent-plugins
  MCODE_VERSION: '0.7.2'
  MCODE_SHA256: aa055b696945286cbab62f8b748835de1428e4d08a598bbf5de4c8a5de71f4e4

jobs:
  artifact:
    if: github.repository == 'antgroup/ai-vision' && github.event.pull_request.head.repo.full_name == github.repository
    name: Build and verify the explicit preview artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
      - name: Test and checksum the candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm test --prefix "$PLUGINS_DIR/minimax-code"
          python "$PLUGINS_DIR/scripts/build_plugins.py" --agent minimax-code --output "$RUNNER_TEMP/plugin-dist"
          python "$PLUGINS_DIR/scripts/verify_plugin_dist.py" --dist "$RUNNER_TEMP/plugin-dist" --agent minimax-code --require-privacy
      - uses: actions/upload-artifact@v4
        with:
          name: minimax-code-preview-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-dist/minimax-code
          if-no-files-found: error
          retention-days: 7

  native-client:
    name: Native client fixture (${{ matrix.host }})
    needs: artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            host: Linux/x86_64
          - runner: ubuntu-22.04-arm
            host: Linux/aarch64
          - runner: macos-15
            host: Darwin/arm64
          - runner: macos-15-intel
            host: Darwin/x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
      - uses: actions/setup-go@v5
        with:
          go-version-file: aivision-cli/go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: minimax-code-preview-${{ env.SOURCE_SHA }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-dist/minimax-code
      - name: Install the pinned official host and build the matching aiv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$RUNNER_OS" == Linux ]]; then getconf GNU_LIBC_VERSION; fi
          archive="$RUNNER_TEMP/minimax-code-$MCODE_VERSION.tar.gz"
          curl --fail --location --proto '=https' --retry 3 --max-time 120 \
            "https://github.com/MiniMax-AI/minimax-code/releases/download/v$MCODE_VERSION/minimax-code-$MCODE_VERSION.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MCODE_SHA256" "$archive" | shasum -a 256 --check
          npm install --global --prefix "$RUNNER_TEMP/mcode" --registry=https://registry.npmjs.org/ \
            --include=optional --ignore-scripts=false --allow-scripts=@minimax-ai/code,better-sqlite3 "$archive"
          test "$("$RUNNER_TEMP/mcode/bin/mcode" --version)" = "$MCODE_VERSION"
          make -C aivision-cli build
          (
            cd aivision-cli
            tar -czf "$RUNNER_TEMP/aiv-candidate.tar.gz" aiv LICENSE \
              deploy/kubernetes/README.md deploy/kubernetes/dependencies/*.LICENSE
          )
          mkdir "$RUNNER_TEMP/aiv-client"
          tar -xzf "$RUNNER_TEMP/aiv-candidate.tar.gz" -C "$RUNNER_TEMP/aiv-client" aiv
          test "$("$RUNNER_TEMP/aiv-client/aiv" --version)" = "aiv $(cat VERSION)"
          python -m pip install -r "$PLUGINS_DIR/tests/native_agent_e2e/requirements.txt"
      - name: Install the candidate and verify captured native traces
        shell: bash
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          python "$PLUGINS_DIR/scripts/verify_plugin_dist.py" --dist "$RUNNER_TEMP/plugin-dist" --agent minimax-code --require-privacy
          {
            printf 'Source: %s\n\n' "$SOURCE_SHA"
            shasum -a 256 "$RUNNER_TEMP/aiv-candidate.tar.gz"
            python "$PLUGINS_DIR/tests/native_agent_e2e/minimax_candidate.py" --repo . \
              --dist "$RUNNER_TEMP/plugin-dist" --aiv "$RUNNER_TEMP/aiv-client/aiv" \
              --mcode "$RUNNER_TEMP/mcode/bin/mcode" --host-platform "$EXPECTED_HOST"
          } | tee -a "$GITHUB_STEP_SUMMARY"
