name: Release aiv CLI

# Produces the aiv-release artifact; release-images.yml owns GitHub publishing.
on:
  pull_request:
    paths:
      - '.github/workflows/release-cli.yml'
      - 'aivision-cli/**'
      - 'scripts/ci/*windows*cli*.py'
  workflow_dispatch:
  workflow_call:
    inputs:
      use_macos_26_arm64:
        description: Use the macOS 26 ARM64 runner for release packaging
        type: boolean
        default: false
      plugin_dist:
        type: boolean
        default: false
      product_version:
        type: string
        default: ''
      run_number:
        type: string
        default: ''
      channel:
        type: string
        default: dev
      snapshot_date:
        type: string
        default: ''
      daily_revision:
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: x64
            hook_platform: linux-gnu/x64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
            hook_platform: linux-gnu/arm64
          - runner: macos-15-intel
            os: darwin
            arch: x64
            hook_platform: darwin/x64
          - runner: macos-15
            os: darwin
            arch: arm64
            hook_platform: darwin/arm64
    runs-on: ${{ matrix.hook_platform == 'darwin/arm64' && inputs.use_macos_26_arm64 && 'macos-26' || matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aivision-cli/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and build
        working-directory: aivision-cli
        env:
          CGO_ENABLED: '0'
          VERIFY_MACOS_ARM64_BASELINE: ${{ matrix.hook_platform == 'darwin/arm64' && inputs.use_macos_26_arm64 }}
          PRODUCT_VERSION: ${{ inputs.product_version }}
          RELEASE_RUN_NUMBER: ${{ inputs.run_number }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_SNAPSHOT_DATE: ${{ inputs.snapshot_date }}
          RELEASE_DAILY_REVISION: ${{ inputs.daily_revision }}
        run: |
          set -euo pipefail
          case "${{ matrix.os }}/${{ matrix.arch }}" in
            */x64) test "$(uname -m)" = x86_64 ;;
            linux/arm64) test "$(uname -m)" = aarch64 ;;
            darwin/arm64) test "$(uname -m)" = arm64 ;;
            *) exit 1 ;;
          esac
          make assets-check
          python3 -m unittest discover -s ../deploy/tests
          go test -mod=vendor ./...
          python3 -m unittest discover -s scripts -p 'test_install.py'
          if [[ -n "$PRODUCT_VERSION" ]]; then
            python3 ../scripts/build/build_info.py --component aiv --channel "$RELEASE_CHANNEL" \
              --source-sha "$GITHUB_SHA" --build-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" \
              --run-number "$RELEASE_RUN_NUMBER" \
              --snapshot-date "$RELEASE_SNAPSHOT_DATE" --daily-revision "$RELEASE_DAILY_REVISION" \
              --product-version "$PRODUCT_VERSION" >/dev/null
            printf '%s\n' "$PRODUCT_VERSION" > "$RUNNER_TEMP/aiv-product-version"
            make build VERSION_SOURCE="$RUNNER_TEMP/aiv-product-version"
          else
            PRODUCT_VERSION="$(cat ../VERSION)"
            make build
          fi
          test "$(./aiv --version)" = "aiv $PRODUCT_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$(./aiv --version)" = "aiv ${GITHUB_REF_NAME#v}"
          fi
          mkdir -p dist
          tar -czf "dist/aiv-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            aiv LICENSE deploy/kubernetes/README.md deploy/kubernetes/dependencies/*.LICENSE
          tar -xzf "dist/aiv-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" -C dist aiv
          test "$(dist/aiv --version)" = "aiv $PRODUCT_VERSION"
          if [[ "$VERIFY_MACOS_ARM64_BASELINE" == true ]]; then
            python3 ../scripts/ci/check_macos_arm64_release.py dist/aiv
          fi
          rm dist/aiv
      - if: inputs.plugin_dist
        uses: actions/download-artifact@v4
        with:
          name: plugin-dist-${{ github.run_attempt }}
          path: plugin-dist
      - name: Verify matching hook artifacts
        if: inputs.plugin_dist
        run: python3 ai-vision/agent-plugins/scripts/verify_plugin_dist.py --dist plugin-dist --platform '${{ matrix.hook_platform }}' --require-privacy
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ github.run_attempt }}-${{ matrix.os }}-${{ matrix.arch }}
          path: aivision-cli/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  windows:
    name: qualify Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
      PRODUCT_VERSION: ${{ inputs.product_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: aivision-cli/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test the native remote client
        working-directory: aivision-cli
        shell: pwsh
        run: |
          if ((go env GOHOSTOS) -ne 'windows' -or (go env GOHOSTARCH) -ne 'amd64' -or
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'X64') {
            throw 'Windows CLI qualification requires a native Windows x64 host.'
          }
          $versionFile = Resolve-Path ../VERSION
          if ($env:PRODUCT_VERSION) {
            $versionFile = Join-Path $env:RUNNER_TEMP 'aiv-windows-product-version'
            Set-Content -LiteralPath $versionFile -Value $env:PRODUCT_VERSION -Encoding ASCII
          }
          $version = go run -mod=vendor ./internal/buildversion "$versionFile"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $version.Trim()
          if ($env:GITHUB_REF.StartsWith('refs/tags/v') -and "v$version" -cne $env:GITHUB_REF_NAME) {
            throw 'Windows CLI version must match the product tag.'
          }
          go test -mod=vendor ./internal/account ./internal/auth ./internal/config ./internal/query
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $env:RUNNER_TEMP 'aiv.exe'
          go build -mod=vendor -ldflags "-X github.com/antgroup/ai-vision/aivision-cli/internal/cli.Version=$version" -o "$binary" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/ci/windows_release_cli.py --binary "$binary" --license LICENSE --archive dist/aiv-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../scripts/ci/qualify_windows_cli.py --archive dist/aiv-windows-x64.zip `
            --installer scripts/install-windows-cli.ps1 --version "$version" --receipt dist/windows-x64.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ github.run_attempt }}-windows-x64
          path: aivision-cli/dist/aiv-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: cli-smoke-${{ github.run_attempt }}-windows-x64
          path: aivision-cli/dist/windows-x64.json
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [build, windows]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-${{ github.run_attempt }}-*
          path: release
          merge-multiple: true
      - name: Package installer and checksums
        run: |
          set -euo pipefail
          for os in linux darwin; do
            for arch in x64 arm64; do test -s "release/aiv-$os-$arch.tar.gz"; done
          done
          test -s release/aiv-windows-x64.zip
          sed "s|__AIV_RELEASE_REPOSITORY__|$GITHUB_REPOSITORY|g" aivision-cli/scripts/install.sh > release/install-aiv.sh
          cd release
          sha256sum aiv-*.tar.gz aiv-windows-x64.zip install-aiv.sh > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aiv-release-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 14
