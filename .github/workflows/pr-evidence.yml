name: PR evidence

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: PR material completeness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Read the policy already in the target branch. Event JSON and GitHub API
      # responses supply PR metadata to the checkers as data.
      - name: Check out target-branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - name: Detect first-time policy introduction
        id: policy
        run: |
          if [ -f scripts/ci/pr_evidence.py ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Bootstrap: target branch has no PR checker. Maintainer review is required; no naming or material validation was performed.'
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## PR naming and material check: not run

          The target branch does not have the checker yet. Maintainers must manually review this PR's evidence and implementation. A completed bootstrap job does not mean naming or materials passed validation and is not sufficient to enable a required check.
          EOF
          fi
          if [ -f scripts/ci/pr_issue.py ]; then
            echo 'issue_available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'issue_available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Bootstrap: the target branch does not yet contain the linked issue checker.'
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Linked issue check pending rollout

          The linked issue check begins once the checker reaches the target branch. Verify the issue link during maintainer review for this PR.
          EOF
          fi
      - name: Check PR naming and material completeness
        if: steps.policy.outputs.available == 'true'
        run: python3 scripts/ci/pr_evidence.py --event "$GITHUB_EVENT_PATH" --summary "$GITHUB_STEP_SUMMARY"
      - name: Check for an existing linked issue
        if: ${{ !cancelled() && steps.policy.outputs.issue_available == 'true' }}
        run: python3 scripts/ci/pr_issue.py --event "$GITHUB_EVENT_PATH" --summary "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
