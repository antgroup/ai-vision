apiVersion: batch/v1
kind: Job
metadata:
  name: aivision-database-init
  namespace: {{.Namespace | quote}}
  labels: {app.kubernetes.io/component: database}
spec:
  parallelism: 1
  completions: 1
  podReplacementPolicy: Failed
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: aivision
    spec:
      serviceAccountName: aivision
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: init
          image: {{.AGENTLENS_IMAGE | quote}}
          imagePullPolicy: {{.IMAGE_PULL | quote}}
          command: [/app/database-init]
          env:
            - {name: OB_HOST, value: oceanbase}
            - {name: OB_HOST_PORT, value: "2881"}
            - {name: OB_USER, value: root@aivision}
            - {name: OB_ATTEMPTS, value: "90"}
            - name: OB_TENANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aivision-ob-tenant
                  key: password
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
