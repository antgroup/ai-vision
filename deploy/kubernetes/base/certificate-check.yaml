apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: aivision-webhook-check
  namespace: {{.Namespace | quote}}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aivision-webhook-check
  namespace: {{.Namespace | quote}}
spec:
  dnsNames: [aivision-webhook-check.local]
  secretName: aivision-webhook-check
  issuerRef:
    name: aivision-webhook-check
    kind: Issuer
