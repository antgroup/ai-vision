name: Build product image candidates

on:
  workflow_call:
    inputs:
      images:
        description: Image names, build contexts and Dockerfiles for the current matrix
        type: string
        required: true
      image_repositories:
        description: Release repository mapping for the requested images
        type: string
        required: true
      product_version:
        description: Product version from the current release plan
        type: string
        required: true

jobs:
  build:
    name: candidate ${{ matrix.image.name }} ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ${{ fromJSON(inputs.image_repositories)[matrix.image.name] }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ${{ fromJSON(inputs.images) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-plan
      - name: Read the shared actual component build identity
        id: identity
        env:
          COMPONENT: ${{ matrix.image.name }}
        run: |
          set -euo pipefail
          identity=$(jq -c --arg image "$COMPONENT" '.[$image].identity' "$RUNNER_TEMP/release-plan/component-plan.json" | base64 -w0)
          echo "base64=$identity" >> "$GITHUB_OUTPUT"
          echo "reuse=$(jq -r --arg image "$COMPONENT" '.[$image].ref // empty' "$RUNNER_TEMP/release-plan/component-plan.json")" >> "$GITHUB_OUTPUT"
      - if: matrix.image.name == 'aivision-be' && steps.identity.outputs.reuse == ''
        uses: actions/download-artifact@v4
        with:
          name: plugin-dist-${{ github.run_attempt }}
          path: ai-vision/agent-plugins/dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify both native children of an unchanged published image
        if: steps.identity.outputs.reuse != ''
        id: reuse
        env:
          IMAGE: ${{ matrix.image.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          digest=$(python3 scripts/ci/release_reuse.py native --directory "$RUNNER_TEMP/release-plan" --component "$IMAGE" --arch "$ARCH")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: build
        if: steps.identity.outputs.reuse == ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: |
            AIVISION_BUILD_INFO_BASE64=${{ steps.identity.outputs.base64 }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.product_version }}
            io.aivision.build-id=${{ github.run_id }}.${{ github.run_attempt }}
          outputs: type=image,name=${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }},mode=max
      - name: Read identity back from the native candidate image
        id: native
        if: steps.identity.outputs.reuse == ''
        env:
          PUSH_DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: ${{ steps.identity.outputs.base64 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$PUSH_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$PUSH_DIGEST" --format '{{json .Manifest}}' > "$RUNNER_TEMP/pushed-manifest.json"
          digest=$(python3 scripts/ci/release_plan.py native-digest --file "$RUNNER_TEMP/pushed-manifest.json" --digest "$PUSH_DIGEST" --arch "$ARCH")
          python3 scripts/ci/release_image.py --ref "$IMAGE_REPOSITORY@$digest" --arch "$ARCH" --identity "$IDENTITY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Export pushed digest, verified native digest and actual build identity
        env:
          PUSH_DIGEST: ${{ steps.build.outputs.digest }}
          NATIVE_DIGEST: ${{ steps.native.outputs.digest || steps.reuse.outputs.digest }}
          IDENTITY: ${{ steps.identity.outputs.base64 }}
          IMAGE: ${{ matrix.image.name }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${NATIVE_DIGEST#sha256:}"
          if [[ -n "$PUSH_DIGEST" ]]; then
            printf '%s\n' "$PUSH_DIGEST" > "$RUNNER_TEMP/digests/push-digest.txt"
          fi
          printf '%s' "$IDENTITY" | base64 -d > "$RUNNER_TEMP/digests/$IMAGE.build-info.json"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ github.run_attempt }}-${{ matrix.image.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 14
