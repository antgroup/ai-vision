[package]
name = "kimihooks"
version = "0.4.1"
edition = "2021"
description = "Kimi-CLI hook program for Langfuse / OTLP observability"

[[bin]]
name = "kimihooks"
path = "src/main.rs"

[[bin]]
name = "kimihooks-replay"
path = "src/bin/kimihooks_replay.rs"

[features]
# Default = `common` edition: no embedded keys, all endpoints come from env vars.
# Build the `aivision` edition explicitly:
#   cargo build --release --no-default-features --features aivision
default = []
# AIVision platform: build.rs reads ./aivision.keys.json and embeds endpoints +
# auth into the binary at compile time. Env vars still take priority at runtime.
aivision = []
# Reserved for Sprint 2 Langfuse direct upload.
langfuse = []

[dependencies]
agentic-otel-common = { path = "../../agentic-otel-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pico-args = "0.5"
md-5 = "0.10"
sha2 = "0.11"
# HTTP exporter（与 cchooks 一致：ureq 3.x + PlatformVerifier TLS）
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
# Basic auth header 编码用
base64 = "0.22"
# report.config.toml 解析（与 cchooks cli/config.rs 对齐）
basic-toml = "0.1"
# 从 ~/.aivision/kimi/config.env 加载配置
dotenvy = "0.15"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "unwind"
