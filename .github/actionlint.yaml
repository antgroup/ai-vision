paths:
  ".github/workflows/{ci,diagnostics-e2e,framework-e2e,native-agent-e2e,promote-release,release-images}.yml":
    ignore:
      # GitHub accepts concurrency.queue, which actionlint v1.7.12 does not parse.
      # CI contract tests check the queued release matrices and publication jobs.
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
