[package]
name = "agentic-otel-common"
version = "0.2.0"
edition = "2021"
description = "Shared OTel utilities for agentic hooks (cchooks, cdxhooks, etc.)"

[features]
default = []
metrics = ["ureq"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.22"
libc = "0.2"
tempfile = "3"
ureq = { version = "3", optional = true, features = ["platform-verifier"] }

[dev-dependencies]
ureq = { version = "3", features = ["platform-verifier"] }
