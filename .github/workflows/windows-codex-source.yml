name: Windows Codex source smoke

on:
  pull_request:
    paths:
      - '.github/workflows/windows-codex-source.yml'
      - 'scripts/ci/windows_codex_source_smoke.py'
      - 'aivision-cli/**'
      - 'ai-vision/agent-plugins/scripts/**'
      - 'ai-vision/agent-plugins/codex/cdxhooks/**'
      - 'ai-vision/agent-plugins/agentic-otel-common/**'
      - 'ai-vision/agent-plugins/tests/native_agent_e2e/windows_codex_onboarding.py'
      - 'ai-vision/agent-plugins/tests/native_agent_e2e/capture.py'
      - 'ai-vision/agent-plugins/tests/native_agent_e2e/loopback_http.py'
      - 'ai-vision/agent-plugins/tests/native_agent_e2e/requirements.txt'

permissions:
  contents: read

concurrency:
  group: windows-codex-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-onboarding:
    name: Windows x64 Codex source onboarding
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: aivision-cli/go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build both Windows CLI editions
        working-directory: aivision-cli
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or
              (go env GOHOSTOS) -ne 'windows' -or (go env GOHOSTARCH) -ne 'amd64' -or
              [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'X64') {
            throw 'Source smoke requires the PR merge checkout on a native Windows x64 host.'
          }
          go build -mod=vendor -o "$env:RUNNER_TEMP/aiv-client.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -mod=vendor -tags windows_codex_connect -o "$env:RUNNER_TEMP/aiv-codex.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the native Codex telemetry hook
        shell: pwsh
        run: |
          $hostInfo = rustc -vV
          if ($LASTEXITCODE -ne 0 -or $hostInfo -notcontains 'host: x86_64-pc-windows-msvc') {
            throw 'Expected the native x64 MSVC Rust toolchain on the Windows runner.'
          }
          cargo build --locked --manifest-path ai-vision/agent-plugins/codex/cdxhooks/Cargo.toml `
            --no-default-features --features common --bin cdxhooks --jobs 2 --target-dir "$env:RUNNER_TEMP/cdxhooks-target"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source preflight, duplicate-free install, and hook export
        shell: pwsh
        run: |
          $requirements = 'ai-vision/agent-plugins/tests/native_agent_e2e/requirements.txt'
          $captureDependencies = Get-Content $requirements | Where-Object { $_ -match '^(httpx|opentelemetry-proto|protobuf)==' }
          if ($captureDependencies.Count -ne 3) { throw 'Expected the pinned OTLP capture dependencies.' }
          python -m pip install @captureDependencies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/ci/windows_codex_source_smoke.py `
            --cli "$env:RUNNER_TEMP/aiv-codex.exe" --remote-client "$env:RUNNER_TEMP/aiv-client.exe" `
            --hook "$env:RUNNER_TEMP/cdxhooks-target/debug/cdxhooks.exe" --receipt "$env:RUNNER_TEMP/windows-codex-source.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-codex-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-codex-source.json
          if-no-files-found: error
          retention-days: 7
