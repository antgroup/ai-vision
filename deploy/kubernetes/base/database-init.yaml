apiVersion: batch/v1
kind: Job
metadata:
  name: aivision-database-init
  namespace: {{.Namespace | quote}}
  labels: {app.kubernetes.io/component: database}
spec:
  parallelism: 1
  completions: 1
  podReplacementPolicy: Failed
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: aivision
    spec:
      serviceAccountName: aivision
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: init
          image: {{.AGENTLENS_IMAGE | quote}}
          imagePullPolicy: {{.IMAGE_PULL | quote}}
{{if eq .NATIVE_PYTHON_RUNTIME "true"}}
          command: [/app/database-init]
          env:
            - {name: OB_HOST, value: oceanbase}
            - {name: OB_HOST_PORT, value: "2881"}
            - {name: OB_USER, value: root@aivision}
            - {name: OB_ATTEMPTS, value: "90"}
            - name: OB_TENANT_PASSWORD
{{else}}
          command: [python, -c]
          args:
            - |
              import os, time, pymysql
              for attempt in range(90):
                  try:
                      db = pymysql.connect(host='oceanbase', port=2881,
                          user='root@aivision', password=os.environ['DB_PASSWORD'],
                          connect_timeout=5, read_timeout=30, write_timeout=30, autocommit=True)
                      break
                  except pymysql.Error:
                      if attempt == 89:
                          raise RuntimeError('OceanBase tenant connection failed after 90 attempts') from None
                      time.sleep(3)
              with db.cursor() as cursor:
                  for name in ('aivision', 'signoz', 'agentlens'):
                      cursor.execute('CREATE DATABASE IF NOT EXISTS `' + name + '` CHARACTER SET utf8mb4')
              db.close()
              print('Databases ready')
          env:
            - name: DB_PASSWORD
{{end}}
              valueFrom:
                secretKeyRef:
                  name: aivision-ob-tenant
                  key: password
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
