[program:app]
command=/home/admin/bin/app.sh
directory=/home/admin/aivision
user=admin
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
stopsignal=QUIT
stopasgroup=true
killasgroup=true
stdout_logfile=/home/admin/logs/aivision/app.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/home/admin/logs/aivision/app.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=PATH="/opt/venv/bin:%(ENV_PATH)s"
