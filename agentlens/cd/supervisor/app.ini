[program:app]
command=/home/admin/bin/app.sh
process_name=%(program_name)s
autostart=true
startretries=3
autorestart=unexpected
exitcodes=0
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
user=admin
redirect_stderr=true
stdout_logfile=/home/admin/logs/agentlens/stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stdout_capture_maxbytes=0
stdout_events_enabled=true
directory=/home/admin/agentlens
