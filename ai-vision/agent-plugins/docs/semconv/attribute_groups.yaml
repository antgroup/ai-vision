# AI Vision Agent Semantic Conventions - Attribute Registry
# Defines all reusable attributes referenced by signals (spans, events, metrics).
# Version: v2.0

groups:
  - id: registry.aivision.billing
    type: attribute_group
    display_name: AI Vision model billing
    brief: "Billing evidence for a model call."
    attributes:
      - id: aivision.billing.mode
        type:
          allow_custom_values: false
          members:
            - id: subscription
              value: "subscription"
              brief: "The call uses a subscription entitlement."
              stability: experimental
            - id: pay_as_you_go
              value: "pay_as_you_go"
              brief: "The call uses metered API billing."
              stability: experimental
        stability: experimental
        requirement_level: opt_in
        brief: "Billing mode established for this model call by the client or connection configuration."
        note: "Omit when unknown. A model name or a protocol-compatible client does not identify its billing mode."
        examples: ["subscription", "pay_as_you_go"]

      - id: aivision.billing.estimate_list_price
        type: boolean
        stability: experimental
        requirement_level: opt_in
        brief: "Legacy subscription estimate preference retained for telemetry compatibility."
        note: "AI Vision estimates eligible subscription usage automatically and ignores this flag."

  - id: registry.aivision.ingest
    type: attribute_group
    display_name: AI Vision authenticated ingest identity
    brief: "Resource attributes stamped by the AI Vision gateway after verifying an ingest token."
    note: "Reserved for gateway output. Clients use the OTLP authorization header to establish identity."
    attributes:
      - id: aivision.space.id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Authenticated AI Vision space identifier."
      - id: aivision.org.id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Organization identifier from the verified ingest claims."
      - id: aivision.user.id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Opaque user identifier from the verified ingest claims."
      - id: aivision.agent.id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Agent identifier from the verified ingest claims."
      - id: aivision.agent.product
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Agent product from the verified ingest claims."
      - id: aivision.ingest.key_id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Non-secret identifier of the credential used for ingestion."

  - id: registry.aivision.otlp
    type: attribute_group
    display_name: AI Vision OTLP metadata
    brief: "Span attributes retained by AI Vision to preserve OTLP instrumentation metadata on readback."
    attributes:
      - id: aivision.otlp.scope.name
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Name of the producing OTLP instrumentation scope."
      - id: aivision.otlp.scope.version
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Version of the producing OTLP instrumentation scope."
      - id: aivision.otlp.sdk.language
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Language of the producing OpenTelemetry SDK."

  - id: registry.session
    type: attribute_group
    display_name: Session compatibility
    brief: "Legacy session attributes supported by AI Vision trace queries."
    attributes:
      - id: session.id
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Compatibility alias for the session identifier."
        note: "Use gen_ai.conversation.id for the canonical conversation identifier."

  # ============================================================
  # Ant Identity Attributes
  # ============================================================
  - id: registry.ant
    type: attribute_group
    display_name: Ant Identity
    brief: "Ant platform identity attributes shared across all signals."
    attributes:
      - id: ant.username
        type: string
        stability: experimental
        requirement_level: required
        brief: "User identifier"
        examples: ["100001"]

      - id: ant.uid
        type: string
        stability: experimental
        requirement_level:
          conditionally_required: "When available"
        brief: "External customer UID"
        examples: ["2088xxxx"]

      - id: ant.agent.type
        type: string
        stability: experimental
        requirement_level: recommended
        brief: "Agent engine type identifier."
        examples: ["claudecode", "opencode", "openclaw"]

      - id: ant.agent.product
        type: string
        stability: experimental
        requirement_level: recommended
        brief: "Agent product name."
        examples: ["openclaw", "codex", "claude-code"]

      - id: ant.meta.trigger
        type:
          allow_custom_values: false
          members:
            - id: unspecified
              value: ""
              brief: "Caller did not declare an invocation trigger"
              stability: experimental
            - id: automation
              value: "automation"
              brief: "Caller-declared automated invocation attributed to automation, scheduler, or an upstream agent orchestrator."
              stability: experimental
            - id: interactive
              value: "interactive"
              brief: "Caller-declared invocation attributed to real-user interaction."
              stability: experimental
            - id: unknown
              value: "unknown"
              brief: "Explicit but unrecognized caller-declared invocation trigger"
              stability: experimental
        stability: experimental
        requirement_level:
          conditionally_required: "For ClaudeCode/cchooks and Codex/cdxhooks Resource attributes"
        brief: "Caller-declared invocation trigger for the telemetry-producing agent process."
        note: "Resource-scoped attribution; do not infer from prompt, transcript, username, Git, or process directory."
        examples: ["", "automation", "interactive", "unknown"]

  # ============================================================
  # User Identity Attributes
  # ============================================================
  - id: registry.user
    type: attribute_group
    display_name: User Identity
    brief: "User identity attributes for access control and auditing."
    attributes:
      - id: user.id
        type: string
        stability: experimental
        requirement_level: required
        brief: "Unique user identifier (account ID or external UID)"
        note: "Currently added for Langfuse userId field mapping compatibility. May be removed in future versions when ant.username is natively supported."
        examples: ["100001", "alice"]

  # ============================================================
  # GenAI Core Attributes
  # ============================================================
  - id: registry.gen_ai
    type: attribute_group
    display_name: GenAI Core
    brief: "GenAI core semantic convention attributes."
    attributes:
      - id: gen_ai.operation.name
        type:
          allow_custom_values: true
          members:
            - id: chat
              value: "chat"
              brief: "Chat completion operation"
              stability: experimental
            - id: create_agent
              value: "create_agent"
              brief: "Create GenAI Agent"
              stability: experimental
            - id: embeddings
              value: "embeddings"
              brief: "Embeddings operation"
              stability: experimental
            - id: execute_tool
              value: "execute_tool"
              brief: "Execute tool"
              stability: experimental
            - id: generate_content
              value: "generate_content"
              brief: "Multimodal content generation"
              stability: experimental
            - id: invoke_agent
              value: "invoke_agent"
              brief: "Invoke GenAI Agent"
              stability: experimental
            - id: retrieval
              value: "retrieval"
              brief: "Retrieval operation"
              stability: experimental
            - id: text_completion
              value: "text_completion"
              brief: "Text completion operation (Legacy)"
              stability: experimental
        stability: experimental
        brief: "The name of the operation being performed."
        examples: ["chat", "invoke_agent", "execute_tool"]

      - id: gen_ai.session.id
        type: string
        stability: experimental
        requirement_level: required
        brief: "A stable session identifier for session lifecycle events."
        examples: ["session_abc123"]

      - id: gen_ai.provider.name
        type:
          allow_custom_values: true
          members:
            - id: anthropic
              value: "anthropic"
              brief: "Anthropic"
              stability: experimental
            - id: openai
              value: "openai"
              brief: "OpenAI"
              stability: experimental
            - id: qwen
              value: "qwen"
              brief: "Tongyi Qwen"
              stability: experimental
            - id: alibaba
              value: "alibaba"
              brief: "Alibaba"
              stability: experimental
            - id: aws_bedrock
              value: "aws.bedrock"
              brief: "AWS Bedrock"
              stability: experimental
            - id: azure_ai_openai
              value: "azure.ai.openai"
              brief: "Azure OpenAI"
              stability: experimental
            - id: deepseek
              value: "deepseek"
              brief: "DeepSeek"
              stability: experimental
            - id: gcp_gemini
              value: "gcp.gemini"
              brief: "Gemini"
              stability: experimental
            - id: gcp_vertex_ai
              value: "gcp.vertex_ai"
              brief: "Vertex AI"
              stability: experimental
            - id: mistral_ai
              value: "mistral_ai"
              brief: "Mistral AI"
              stability: experimental
        stability: experimental
        brief: "The name of the GenAI provider."
        examples: ["anthropic", "openai", "qwen"]

      - id: gen_ai.system
        type:
          allow_custom_values: true
          members:
            - id: anthropic
              value: "anthropic"
              brief: "Anthropic"
              stability: experimental
            - id: openai
              value: "openai"
              brief: "OpenAI"
              stability: experimental
            - id: qwen
              value: "qwen"
              brief: "Tongyi Qwen"
              stability: experimental
            - id: alibaba
              value: "alibaba"
              brief: "Alibaba"
              stability: experimental
            - id: aws_bedrock
              value: "aws.bedrock"
              brief: "AWS Bedrock"
              stability: experimental
            - id: azure_ai_openai
              value: "azure.ai.openai"
              brief: "Azure OpenAI"
              stability: experimental
            - id: deepseek
              value: "deepseek"
              brief: "DeepSeek"
              stability: experimental
            - id: gcp_gemini
              value: "gcp.gemini"
              brief: "Gemini"
              stability: experimental
            - id: gcp_vertex_ai
              value: "gcp.vertex_ai"
              brief: "Vertex AI"
              stability: experimental
            - id: mistral_ai
              value: "mistral_ai"
              brief: "Mistral AI"
              stability: experimental
            - id: theta
              value: "theta"
              brief: "Theta (MiniMax)"
              stability: experimental
        stability: experimental
        brief: "Legacy compatibility provider identifier. New telemetry SHOULD use `gen_ai.provider.name` instead."
        examples: ["openai", "anthropic", "qwen"]

      - id: gen_ai.span.kind
        type:
          allow_custom_values: true
          members:
            - id: chat
              value: "CHAT"
              brief: "Chat entry point"
              stability: experimental
            - id: agent
              value: "AGENT"
              brief: "Agent service invocation"
              stability: experimental
            - id: llm
              value: "LLM"
              brief: "Model service invocation"
              stability: experimental
            - id: tool
              value: "TOOL"
              brief: "Tool invocation"
              stability: experimental
            - id: compaction
              value: "COMPACTION"
              brief: "Context compaction system operation"
              stability: experimental
            - id: mcp
              value: "MCP"
              brief: "MCP protocol invocation"
              stability: experimental
            - id: retriever
              value: "RETRIEVER"
              brief: "Retrieval operation"
              stability: experimental
            - id: reranker
              value: "RERANKER"
              brief: "Reranking operation"
              stability: experimental
            - id: embedding
              value: "EMBEDDING"
              brief: "Embedding operation"
              stability: experimental
            - id: guardrail
              value: "GUARDRAIL"
              brief: "Content safety check"
              stability: experimental
        stability: experimental
        brief: "Ant extended span type. Distinguishes different span categories in the Ant agent system."
        examples: ["CHAT", "AGENT", "LLM", "TOOL"]

  # ============================================================
  # GenAI Request Attributes
  # ============================================================
  - id: registry.gen_ai.request
    type: attribute_group
    display_name: GenAI Request
    brief: "GenAI request parameters."
    attributes:
      - id: gen_ai.request.model
        type: string
        stability: experimental
        brief: "The name of the model a request is being made to."
        examples: ["claude-sonnet-4-6", "qwen-max"]

      - id: gen_ai.request.temperature
        type: double
        stability: experimental
        brief: "The temperature setting for generation."
        examples: [0.0, 0.7, 1.0]

      - id: gen_ai.request.max_tokens
        type: int
        stability: experimental
        brief: "The maximum number of tokens to generate."
        examples: [100, 4000]

      - id: gen_ai.request.top_p
        type: double
        stability: experimental
        brief: "Top-p sampling parameter."
        examples: [1.0]

      - id: gen_ai.request.top_k
        type: double
        stability: experimental
        brief: "Top-k sampling parameter."
        examples: [1.0, 3.0]

      - id: gen_ai.request.frequency_penalty
        type: double
        stability: experimental
        brief: "Frequency penalty parameter."
        examples: [0.1]

      - id: gen_ai.request.presence_penalty
        type: double
        stability: experimental
        brief: "Presence penalty parameter."
        examples: [0.1]

      - id: gen_ai.request.stop_sequences
        type: string[]
        stability: experimental
        brief: "List of stop sequences."
        examples: [["forest", "lived"]]

      - id: gen_ai.request.seed
        type: int
        stability: experimental
        brief: "Random seed for deterministic generation."
        examples: [100]

      - id: gen_ai.request.choice.count
        type: int
        stability: experimental
        brief: "Number of candidate completions."
        examples: [1, 3]

      - id: gen_ai.request.encoding_formats
        type: string[]
        stability: experimental
        brief: "Requested encoding formats for embeddings."
        examples: [["float", "binary"]]

  # ============================================================
  # GenAI Response Attributes
  # ============================================================
  - id: registry.gen_ai.response
    type: attribute_group
    display_name: GenAI Response
    brief: "GenAI response attributes."
    attributes:
      - id: gen_ai.response.model
        type: string
        stability: experimental
        brief: "The name of the model that generated the response."
        examples: ["claude-sonnet-4-6-20250514"]

      - id: gen_ai.response.id
        type: string
        stability: experimental
        brief: "Unique identifier for the completion."
        examples: ["chatcmpl-123", "msg_abc123"]

      - id: gen_ai.response.finish_reasons
        type: string[]
        stability: experimental
        brief: "Array of reasons the model stopped generating."
        examples: [["stop"], ["end_turn"]]

      - id: gen_ai.response.time_to_first_token
        type: int
        stability: experimental
        brief: "Time to first token in milliseconds."
        examples: [538, 2000, 5782]

  # ============================================================
  # GenAI Usage Attributes
  # ============================================================
  - id: registry.gen_ai.usage
    type: attribute_group
    display_name: GenAI Usage
    brief: "GenAI token usage attributes."
    attributes:
      - id: gen_ai.usage.input_tokens
        type: int
        stability: experimental
        brief: "Total number of input tokens, including cached input tokens."
        examples: [100, 1500]

      - id: gen_ai.usage.output_tokens
        type: int
        stability: experimental
        brief: "Number of output tokens."
        examples: [180, 800]

      - id: gen_ai.usage.total_tokens
        type: int
        stability: experimental
        brief: "Total number of tokens (input + output)."
        examples: [300, 2300]

      - id: gen_ai.usage.cache_read.input_tokens
        type: int
        stability: experimental
        brief: "Number of input tokens read from cache."
        examples: [50, 500]

      - id: gen_ai.usage.cache_creation.input_tokens
        type: int
        stability: experimental
        brief: "Number of input tokens written to cache."
        examples: [25, 200]

      - id: gen_ai.usage.reasoning.output_tokens
        type: int
        stability: experimental
        brief: "Reasoning output tokens, already included in output_tokens."
        examples: [0, 120]

      - id: gen_ai.usage.details.cache_read_input_tokens
        type: int
        stability: experimental
        brief: "Cache read tokens (Ant extended detail field)."
        examples: [50]

      - id: gen_ai.usage.details.cache_creation_input_tokens
        type: int
        stability: experimental
        brief: "Cache creation tokens (Ant extended detail field)."
        examples: [25]

      - id: gen_ai.usage.details.cache_hit_rate
        type: double
        stability: experimental
        brief: "Cache hit rate (Ant extended detail field)."
        examples: [0.85]

  # ============================================================
  # GenAI Agent Attributes
  # ============================================================
  - id: registry.gen_ai.agent
    type: attribute_group
    display_name: GenAI Agent
    brief: "GenAI agent identification attributes."
    attributes:
      - id: gen_ai.agent.id
        type: string
        stability: experimental
        brief: "Unique identifier for the agent."
        examples: ["asst_5j66UpCpwteGg4YSxUnt7lPY", "29794"]

      - id: gen_ai.agent.name
        type: string
        stability: experimental
        brief: "Human-readable name of the agent."
        examples: ["Math Tutor", "CodeAssistant"]

      - id: gen_ai.agent.version
        type: string
        stability: experimental
        brief: "Version of the agent."
        examples: ["1.0.0", "v1.2.3"]

      - id: gen_ai.agent.description
        type: string
        stability: experimental
        brief: "Description of the agent."
        examples: ["Helps with math problems"]

  # ============================================================
  # GenAI Tool Attributes
  # ============================================================
  - id: registry.gen_ai.tool
    type: attribute_group
    display_name: GenAI Tool
    brief: "GenAI tool invocation attributes."
    attributes:
      - id: gen_ai.tool.call.id
        type: string
        stability: experimental
        brief: "Unique identifier for the tool call."
        examples: ["call_mszuSIzqtI65i1wAUOE8w5H4"]

      - id: gen_ai.tool.name
        type: string
        stability: experimental
        brief: "Name of the tool."
        examples: ["Read", "Edit", "Bash", "Flights"]

      - id: gen_ai.tool.type
        type:
          allow_custom_values: true
          members:
            - id: function
              value: "function"
              brief: "Client-side execution. Agent generates parameters, client executes logic."
              stability: experimental
            - id: extension
              value: "extension"
              brief: "Agent-side execution. Directly calls external APIs."
              stability: experimental
            - id: datastore
              value: "datastore"
              brief: "Access and query structured/unstructured external data."
              stability: experimental
            - id: skill
              value: "skill"
              brief: "Predefined prompt-driven workflow. Agent runtime loads and executes a skill template."
              stability: experimental
        stability: experimental
        brief: "Type of the tool."
        examples: ["function", "extension", "datastore", "skill"]

      - id: gen_ai.tool.description
        type: string
        stability: experimental
        brief: "Description of the tool."
        examples: ["Read file content"]

      - id: gen_ai.tool.call.arguments
        type: string
        stability: experimental
        brief: "Tool call arguments (Opt-In, may contain sensitive data)."
        examples: ['{"path":"src/main.ts"}']

      - id: gen_ai.tool.call.parameters
        type: string
        stability: experimental
        brief: "Tool call parameters (alias for gen_ai.tool.call.arguments)."
        note: "Some runtimes use 'parameters' instead of 'arguments'. Semantically equivalent."
        examples: ['{"path":"src/main.ts"}']

      - id: gen_ai.tool.call.result
        type: string
        stability: experimental
        brief: "Tool call result (Opt-In, may contain sensitive data)."
        examples: ['{"updated":true}']

      - id: gen_ai.tool.definitions
        type: string
        stability: experimental
        brief: "Available tool definitions list (Opt-In)."

  # ============================================================
  # GenAI Conversation Attributes
  # ============================================================
  - id: registry.gen_ai.conversation
    type: attribute_group
    display_name: GenAI Conversation
    brief: "GenAI conversation and chat identification attributes."
    attributes:
      - id: gen_ai.conversation.id
        type: string
        stability: experimental
        brief: "Unique identifier for the conversation."
        examples: ["conv_5j66UpCpwteGg4YSxUnt7lPY", "conv-abc-123"]

      - id: gen_ai.chat.id
        type: string
        stability: experimental
        brief: "Unique identifier for a single chat turn within a conversation."
        examples: ["chat-456"]

  # ============================================================
  # GenAI Content Attributes
  # ============================================================
  - id: registry.gen_ai.content
    type: attribute_group
    display_name: GenAI Content
    brief: "GenAI input/output content attributes."
    attributes:
      - id: gen_ai.input.messages
        type: string
        stability: experimental
        brief: "JSON-serialized array of input messages in OpenAI API format: [{role, content, tool_calls?, tool_call_id?}]. Opt-In, may contain sensitive data."

      - id: gen_ai.output.messages
        type: string
        stability: experimental
        brief: "JSON-serialized array of output messages in OpenAI API format: [{role, content, finish_reason, tool_calls?}]. Opt-In, may contain sensitive data."

      - id: gen_ai.system_instructions
        type: string
        stability: experimental
        brief: "JSON-serialized string of system instructions independent of chat history. Opt-In, may contain sensitive data."

      - id: gen_ai.output.type
        type:
          allow_custom_values: true
          members:
            - id: text
              value: "text"
              brief: "Plain text"
              stability: experimental
            - id: json
              value: "json"
              brief: "JSON object"
              stability: experimental
            - id: image
              value: "image"
              brief: "Image"
              stability: experimental
            - id: speech
              value: "speech"
              brief: "Speech"
              stability: experimental
        stability: experimental
        brief: "Requested output content type."
        examples: ["text", "json"]

      - id: gen_ai.data_source.id
        type: string
        stability: experimental
        brief: "Data source identifier."
        examples: ["H7STPQYOND", "zsearch-knowledge-base"]

      - id: gen_ai.token.type
        type:
          allow_custom_values: true
          members:
            - id: input
              value: "input"
              brief: "Input token"
              stability: experimental
            - id: output
              value: "output"
              brief: "Output token"
              stability: experimental
            - id: cache_read
              value: "cache_read"
              brief: "Cache read token (Ant extension)"
              stability: experimental
            - id: cache_creation
              value: "cache_creation"
              brief: "Cache creation token (Ant extension)"
              stability: experimental
        stability: experimental
        brief: "Token type for metrics."
        examples: ["input", "output"]

  # ============================================================
  # GenAI Evaluation Attributes
  # ============================================================
  - id: registry.gen_ai.evaluation
    type: attribute_group
    display_name: GenAI Evaluation
    brief: "GenAI evaluation result attributes."
    attributes:
      - id: gen_ai.evaluation.name
        type: string
        stability: experimental
        requirement_level: required
        brief: "Name of the evaluation metric."
        examples: ["Relevance", "IntentResolution"]

      - id: gen_ai.evaluation.score.label
        type: string
        stability: experimental
        brief: "Evaluation score label."
        examples: ["relevant", "pass", "fail"]

      - id: gen_ai.evaluation.score.value
        type: double
        stability: experimental
        brief: "Evaluation score value."
        examples: [4.0]

      - id: gen_ai.evaluation.explanation
        type: string
        stability: experimental
        brief: "Evaluation explanation."
        examples: ["The response is factually accurate."]

  # ============================================================
  # GenAI Embeddings Attributes
  # ============================================================
  - id: registry.gen_ai.embeddings
    type: attribute_group
    display_name: GenAI Embeddings
    brief: "GenAI embeddings operation attributes."
    attributes:
      - id: gen_ai.embeddings.dimension.count
        type: int
        stability: experimental
        brief: "Number of dimensions in the output embeddings."
        examples: [1024]

  # ============================================================
  # GenAI Retrieval Attributes
  # ============================================================
  - id: registry.gen_ai.retrieval
    type: attribute_group
    display_name: GenAI Retrieval
    brief: "GenAI retrieval operation attributes."
    attributes:
      - id: gen_ai.retrieval.documents
        type: string
        stability: experimental
        brief: "Retrieved documents list (Opt-In)."

      - id: gen_ai.retrieval.query.text
        type: string
        stability: experimental
        brief: "Retrieval query text (Opt-In, may contain sensitive data)."

  # ============================================================
  # Server Attributes
  # ============================================================
  - id: registry.server
    type: attribute_group
    display_name: Server
    brief: "Server connection attributes."
    attributes:
      - id: server.address
        type: string
        stability: experimental
        brief: "Server address (hostname or IP)."
        examples: ["api.anthropic.com", "dashscope.aliyuncs.com"]

      - id: server.port
        type: int
        stability: experimental
        brief: "Server port number."
        examples: [443]

  # ============================================================
  # Version Control System / Repository Context Attributes
  # ============================================================
  - id: registry.vcs
    type: attribute_group
    display_name: Version Control System
    brief: "Git repository and HEAD context attached to telemetry Resource when available."
    attributes:
      - id: vcs.repository.url.full
        type: string
        stability: experimental
        requirement_level:
          conditionally_required: "When a trusted Git worktree exposes a repository remote"
        brief: "Full URL of the Git repository remote selected for the current worktree."
        examples: ["ssh://git@example.test/team/repo.git"]
        note: "May expose organization or project identity; omit when no trusted remote is available."

      - id: vcs.ref.head.name
        type: string
        stability: experimental
        requirement_level:
          conditionally_required: "When a trusted Git worktree exposes the current HEAD reference"
        brief: "Name of the current Git HEAD reference or the literal `HEAD` for detached HEAD."
        examples: ["main", "feature/repository-context", "HEAD"]
        note: "Do not infer a branch from a directory name or an unrelated parent repository."

      - id: vcs.ref.head.revision
        type: string
        stability: experimental
        requirement_level: opt_in
        brief: "Revision identifier of the current Git HEAD when the runtime exposes it."
        examples: ["0123456789abcdef0123456789abcdef01234567"]
        note: "Optional enhancement; collectors must not run an unbounded or replay-local probe solely to populate it."

