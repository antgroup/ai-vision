name: MiniMax Code OCI candidate

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact MiniMax preview pull request head
        type: string
        required: true
      preview_artifact:
        description: Same MiniMax preview dist artifact as the native client jobs
        type: string
        required: true

permissions:
  contents: read

jobs:
  qualify:
    name: Packaged MiniMax preview on seekdb and OceanBase CE
    if: >-
      github.event_name == 'pull_request' && github.repository == 'antgroup/ai-vision' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop' && github.event.pull_request.head.sha == inputs.source_sha
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PREVIEW_ARTIFACT: ${{ inputs.preview_artifact }}
      PLUGINS_DIR: ai-vision/agent-plugins
      MCODE_VERSION: '0.7.2'
      MCODE_SHA256: aa055b696945286cbab62f8b748835de1428e4d08a598bbf5de4c8a5de71f4e4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          use: false
      - name: Check candidate identity and free disposable runner space
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$RUNNER_ENVIRONMENT/$RUNNER_OS/$RUNNER_ARCH" = github-hosted/Linux/X64
          [[ "$PREVIEW_ARTIFACT" =~ ^minimax-code-preview-${SOURCE_SHA}-[1-9][0-9]*$ ]]
          zstd --version
          python scripts/ci/prepare_platform_disk.py
          df -h "$RUNNER_TEMP"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.preview_artifact }}
          path: ${{ runner.temp }}/minimax-oci/plugin-dist/minimax-code
      - name: Build local images and candidate archive
        run: |
          set -euo pipefail
          python scripts/ci/minimax_oci_candidate.py --source-sha "$SOURCE_SHA" \
            --build-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT" --output "$RUNNER_TEMP/minimax-oci"
          {
            printf '## Linux amd64 MiniMax OCI candidate\n\n'
            printf 'Source `%s` using preview `%s`.\n\n' "$SOURCE_SHA" "$PREVIEW_ARTIFACT"
            printf 'The backend contains the explicit MiniMax preview distribution.\n\n'
            printf '```json\n'
            cat "$RUNNER_TEMP/minimax-oci/inputs.json"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain image-only local replay inputs for one day
        uses: actions/upload-artifact@v4
        with:
          name: minimax-oci-linux-amd64-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/minimax-oci/product-images.tar.zst
            ${{ runner.temp }}/minimax-oci/aiv-linux-amd64.tar.gz
            ${{ runner.temp }}/minimax-oci/inputs.json
            ${{ runner.temp }}/minimax-oci/image-details.json
            ${{ runner.temp }}/minimax-oci/SHA256SUMS
            ${{ runner.temp }}/minimax-oci/plugin-dist/minimax-code/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Pull and verify the pinned native dependencies
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/minimax-oci"
          rm -- "$candidate/product-images.tar.zst"
          for service in signoz seekdb oceanbase-ce; do
            ref=$(jq -er --arg service "$service" '.images[$service]' "$candidate/inputs.json")
            expected_id=$(jq -er --arg service "$service" '.image_ids[$service]' "$candidate/inputs.json")
            docker pull --platform linux/amd64 "$ref"
            actual=$(docker image inspect --format '{{.Os}}/{{.Architecture}} {{.Id}}' "$ref")
            test "$actual" = "linux/amd64 $expected_id"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
      - name: Install pinned MiniMax CLI and fixture dependencies
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/minimax-code-$MCODE_VERSION.tar.gz"
          curl --fail --location --proto '=https' --retry 3 --max-time 120 \
            "https://github.com/MiniMax-AI/minimax-code/releases/download/v$MCODE_VERSION/minimax-code-$MCODE_VERSION.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MCODE_SHA256" "$archive" | sha256sum --check
          npm install --global --prefix "$RUNNER_TEMP/mcode" --registry=https://registry.npmjs.org/ \
            --include=optional --ignore-scripts=false --allow-scripts=@minimax-ai/code,better-sqlite3 "$archive"
          test "$("$RUNNER_TEMP/mcode/bin/mcode" --version)" = "$MCODE_VERSION"
          python -m pip install -r "$PLUGINS_DIR/tests/native_agent_e2e/requirements.txt"
      - name: Qualify the same images on seekdb, then OceanBase CE
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/minimax-oci"
          python deploy/tests/minimax_oci_acceptance.py --inputs "$candidate/inputs.json" \
            --aiv-archive "$candidate/aiv-linux-amd64.tar.gz" --plugin-dist "$candidate/plugin-dist" \
            --mcode "$RUNNER_TEMP/mcode/bin/mcode" --runtime-base "$RUNNER_TEMP" --out "$candidate/receipts"
      - name: Retain only sanitized deployment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimax-oci-receipts-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/minimax-oci/receipts/seekdb.json
            ${{ runner.temp }}/minimax-oci/receipts/oceanbase-ce.json
          retention-days: 7
          if-no-files-found: ignore
