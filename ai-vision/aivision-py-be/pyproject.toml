[project]
name = "aivision"
version = "0.1.0"
description = "AI Vision Django Backend"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "AI Vision Team" }
]
license = { text = "MIT" }

dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-cors-headers>=4.3,<4.4",
    "django-environ>=0.11,<0.12",
    "python-dotenv>=1.0,<2.0",
    "mysql-connector-python>=9.0,<10.0",
    "gunicorn>=21.2,<22.0",
    "jinja2>=3.1.6",
    "pyyaml>=6.0",
    "requests>=2.32.5",
    "whitenoise>=6.12.0",
    "cryptography>=46.0.7",
    "pypinyin>=0.55,<0.56",
    "django-json-widget>=2.1.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-django>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

[project.optional-dependencies]
dev = [
    "black>=24.8,<25.0",
    "flake8>=7.0,<7.1",
    "isort>=5.13,<5.14",
    "mypy>=1.8,<1.9",
    "pytest>=7.4,<7.5",
    "pytest-django>=4.8,<4.9",
    "pytest-cov>=4.1,<4.2",
    "factory-boy>=3.3,<3.4",
]





[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aivision.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
testpaths = ["apps"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["aivision"]
