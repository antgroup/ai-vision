name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  workflow_dispatch:
    inputs:
      tier:
        description: Use pr for basic/integration checks; full daily/release does not publish.
        type: choice
        options: [pr, daily, release]
        default: pr
      profile:
        description: Basic checks, explicit deployment integration, or the complete tier.
        type: choice
        options: [basic, integration, full]
        default: basic
  workflow_call:
    inputs:
      public_platform_images:
        description: Pinned public candidate images from the current release attempt
        type: string
        default: ''
      public_deploy_images:
        description: Exact candidate images including the data-backend mirror for strict deployment
        type: string
        default: ''
      tier:
        type: string
        required: true
      profile:
        type: string
        default: full

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.profile || 'basic' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      tier: ${{ steps.plan.outputs.tier }}
      profile: ${{ steps.plan.outputs.profile }}
      framework: ${{ steps.plan.outputs.framework }}
      diagnostics: ${{ steps.plan.outputs.diagnostics }}
      native: ${{ steps.plan.outputs.native }}
      collector: ${{ steps.plan.outputs.collector }}
      adr: ${{ steps.plan.outputs.adr }}
      deployment: ${{ steps.plan.outputs.deployment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          REQUESTED_TIER: ${{ inputs.tier || 'pr' }}
          REQUESTED_PROFILE: ${{ inputs.profile || 'basic' }}
        run: python3 scripts/ci/plan.py --event "$GITHUB_EVENT_PATH" --tier "$REQUESTED_TIER" --profile "$REQUESTED_PROFILE"

  metadata:
    needs: scope
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: >-
          needs.scope.outputs.framework == 'true' || needs.scope.outputs.diagnostics == 'true' ||
          needs.scope.outputs.native == 'true' || needs.scope.outputs.collector == 'true' ||
          needs.scope.outputs.adr == 'true' || needs.scope.outputs.deployment == 'true'
        with:
          go-version: '1.25.7'
          cache: false
      - name: Install YAML parser for workflow contract tests
        run: python -m pip install PyYAML==6.0.3
      - name: Validate capability evidence and generated policy documentation
        id: document-contracts
        run: |
          python ai-vision/agent-plugins/scripts/validate_capabilities.py --quiet
          python ai-vision/agent-plugins/weaver/scripts/spec_sync.py check
      - name: Build metadata and CI policy tests
        if: >-
          needs.scope.outputs.framework == 'true' || needs.scope.outputs.diagnostics == 'true' ||
          needs.scope.outputs.native == 'true' || needs.scope.outputs.collector == 'true' ||
          needs.scope.outputs.adr == 'true' || needs.scope.outputs.deployment == 'true'
        run: |
          python -m unittest discover -s scripts/build -p 'test_*.py' -v
          python -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python -m unittest discover -s aivision-cli/scripts -p 'test_deploy_smoke.py' -v
      - name: Validate workflow syntax
        if: >-
          needs.scope.outputs.framework == 'true' || needs.scope.outputs.diagnostics == 'true' ||
          needs.scope.outputs.native == 'true' || needs.scope.outputs.collector == 'true' ||
          needs.scope.outputs.adr == 'true' || needs.scope.outputs.deployment == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  framework:
    needs: scope
    if: needs.scope.outputs.framework == 'true'
    uses: ./.github/workflows/framework-e2e.yml
    with:
      public_platform_images: ${{ inputs.public_platform_images }}
      tier: ${{ needs.scope.outputs.tier }}
      frontend: ${{ fromJSON(needs.scope.outputs.plan).frontend }}
      backend: ${{ fromJSON(needs.scope.outputs.plan).backend }}
      cli: ${{ fromJSON(needs.scope.outputs.plan).cli }}
      contracts: ${{ fromJSON(needs.scope.outputs.plan).framework_contracts }}
      database: ${{ fromJSON(needs.scope.outputs.plan).framework_database }}
      platform: ${{ fromJSON(needs.scope.outputs.plan).framework_platform }}

  diagnostics:
    needs: scope
    if: needs.scope.outputs.diagnostics == 'true'
    uses: ./.github/workflows/diagnostics-e2e.yml
    with:
      public_platform_images: ${{ inputs.public_platform_images }}
      tier: ${{ needs.scope.outputs.tier }}
      portable: ${{ fromJSON(needs.scope.outputs.plan).diagnostics_portable }}
      application: ${{ fromJSON(needs.scope.outputs.plan).diagnostics_application }}
      database: ${{ fromJSON(needs.scope.outputs.plan).diagnostics_database }}
      platform: ${{ fromJSON(needs.scope.outputs.plan).diagnostics_platform }}

  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    uses: ./.github/workflows/native-agent-e2e.yml
    with:
      public_platform_images: ${{ inputs.public_platform_images }}
      tier: ${{ needs.scope.outputs.tier }}
      units: ${{ fromJSON(needs.scope.outputs.plan).native_units }}
      unit_scope: ${{ toJSON(fromJSON(needs.scope.outputs.plan).native_unit_groups) }}
      source: ${{ fromJSON(needs.scope.outputs.plan).native_source }}
      platform: ${{ fromJSON(needs.scope.outputs.plan).native_platform }}

  collector:
    needs: scope
    if: needs.scope.outputs.collector == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.tier == 'release' && '["ubuntu-24.04","macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: antcollector
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: antcollector/go.mod
          cache: true
          cache-dependency-path: antcollector/go.sum
      - name: Test and compile the current gateway
        run: |
          go test -mod=vendor ./...
          go build -mod=vendor -o "${{ runner.temp }}/antcollector" ./cmd/app

  adr:
    needs: scope
    if: needs.scope.outputs.adr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: agentlens
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check records, generated indexes and authoring compatibility
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install PyYAML==6.0.3 pytest==9.1.1
          .venv/bin/python scripts/adr.py index
          git diff --exit-code -- docs/adr
          .venv/bin/python scripts/adr.py check
          .venv/bin/python -m pytest -c /dev/null --rootdir=. --confcutdir=tests/unit/scripts tests/unit/scripts/test_adr.py -q

  deployment:
    needs: scope
    if: needs.scope.outputs.deployment == 'true'
    uses: ./.github/workflows/seekdb-deploy-smoke.yml
    with:
      public_platform_images: ${{ inputs.public_deploy_images }}

  ci-gate:
    name: ${{ inputs.profile == 'integration' && 'Integration plan guard' || 'ci-gate' }}
    if: always() && inputs.profile != 'integration'
    needs: [scope, metadata, framework, diagnostics, native, collector, adr, deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every selected test family
        env:
          CI_PLAN: ${{ needs.scope.outputs.plan || '{}' }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/plan.py --check-results --expected-profile basic --expected-profile full

  integration-gate:
    name: Integration checks passed
    if: always() && inputs.profile == 'integration'
    needs: [scope, metadata, framework, diagnostics, native, collector, adr, deployment]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every explicitly selected integration family
        env:
          CI_PLAN: ${{ needs.scope.outputs.plan || '{}' }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/plan.py --check-results --expected-profile integration
